<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrobiology Field Sheets</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --head: #e7e5f6; --link: #1c5cab; --wash: rgba(42,120,214,0.07); --tab-on: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --head: #2a2840; --link: #86b6ef; --wash: rgba(57,135,229,0.12); --tab-on: #2a2a29;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --head: #2a2840; --link: #86b6ef; --wash: rgba(57,135,229,0.12); --tab-on: #2a2a29;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
header { padding: 14px 20px 0; }
header h1 { font-size: 17px; font-weight: 650; margin: 0 0 2px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.dl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; color: #ffffff;
  background: #d62839; border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
.dl:hover { background: #b51f2f; }
header p { margin: 0 0 10px; color: var(--ink-2); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 20px; border-bottom: 1px solid var(--axis); scrollbar-width: thin; }
.tabs button { font: inherit; color: var(--ink-2); background: none; border: 1px solid transparent; border-bottom: none;
  border-radius: 8px 8px 0 0; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); background: var(--wash); }
.tabs button.on { color: var(--ink); font-weight: 600; background: var(--tab-on); border-color: var(--axis); margin-bottom: -1px; }
.tabs button .n { color: var(--muted); font-weight: 400; margin-left: 5px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 20px; }
.toolbar input { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 9px; min-width: 260px; }
.toolbar .count { color: var(--muted); }
.toolbar .hint { color: var(--muted); margin-left: auto; }
main { flex: 1; min-height: 0; padding: 0 20px 16px; display: flex; flex-direction: column; }
.tablewrap { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--ring); border-radius: 8px; background: var(--raised); }
table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--head); font-weight: 600; cursor: pointer; user-select: none;
  min-width: 70px; max-width: 260px; white-space: normal; border-bottom: 1px solid var(--axis); }
thead th .arrow { color: var(--muted); }
tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); color: var(--muted); font-weight: 400; text-align: right; cursor: default; }
td { max-width: 420px; }
td .c { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
tr.open td .c { display: block; -webkit-line-clamp: unset; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--wash); }
.more { margin: 10px auto 0; display: block; font: inherit; color: var(--link); background: none; border: 1px solid var(--axis); border-radius: 6px; padding: 5px 14px; cursor: pointer; }
.readme { max-width: 980px; }
/* the workflow PNG has a transparent background and thin black arrows: keep it on a light plate in both themes */
.workflow { margin: 0 0 22px; max-width: 1180px; }
.workflow a { display: block; background: #fbf9f4; border: 1px solid var(--ring); border-radius: 10px; padding: 10px; }
.workflow img { display: block; width: 100%; height: auto; }
.workflow figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
.readme dl { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 10px 18px; margin: 4px 0 0; }
@media (max-width: 640px) { .readme dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; } .readme dd { margin-bottom: 10px; } }
.readme dt { font-weight: 600; }
.readme dd { margin: 0; color: var(--ink-2); }
.readme h2 { font-size: 15px; margin: 6px 0 12px; }
.empty { color: var(--muted); padding: 24px; }
@media (max-width: 640px) { header, .toolbar, main { padding-left: 16px; padding-right: 16px; } .tabs { padding: 0 16px; } .toolbar input { min-width: 0; flex: 1; } .toolbar .hint { display: none; } }
</style>
</head>
<body>
<style>
.masthead { background: var(--raised); border-bottom: 1.5px dashed var(--ink); }
.masthead nav { display: flex; align-items: center; gap: 24px; padding: 12px 20px; overflow-x: auto; }
.masthead .site { font: 700 15px "Roboto Slab", Georgia, serif; color: var(--ink); text-decoration: none; white-space: nowrap; }
.masthead .site::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #d62839; margin-right: 10px; vertical-align: 1px; }
.tools { display: flex; gap: 2px; background: var(--page); border: 1px solid var(--axis); border-radius: 999px; padding: 3px; }
.tools a { padding: 3px 12px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 13px; white-space: nowrap; }
.tools a:hover { color: var(--ink); }
.tools a.on { background: var(--ink); color: var(--raised); font-weight: 600; }
@media (max-width: 640px) { .masthead nav { padding: 10px 16px; gap: 14px; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<div class="masthead"><nav>
  <a class="site" href="index.html">DeepAstroBio</a>
  <div class="tools"><a href="index.html">Paper Scan</a><a class="on" href="sheets.html" aria-current="page">Field Sheets</a></div>
</nav></div>
<header>
  <div class="titlerow"><h1 id="title">Astrobiology journal field sheets</h1><a class="dl" href="data/astrobio_field_sheets_2025-11-01_2026-10-31.xlsx" download>Download Excel (.xlsx)</a></div>
  <p id="sub"></p>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="toolbar" id="toolbar"><input type="search" id="q" placeholder="Search this sheet"><span class="count" id="count"></span><span class="hint">Click a header to sort · click a row to expand long cells</span></div>
<main><div class="tablewrap" id="wrap"></div><button class="more" id="more">Show more rows</button></main>

<script>
const DATA = {"subtitle": "International Journal of Astrobiology and Astrobiology papers published online 2025-11-01 to 2026-10-31 · generated 2026-11-17 · same content as the Excel file", "sheets": [{"name": "README", "readme": [["Astrobiology journal paper / author / citation field matrices", ""], ["Period", "Papers published online 2025-11-01 to 2026-10-31 (Crossref). Generated 2026-11-17."], ["Astrobiology journals", "International Journal of Astrobiology and Astrobiology (SAGE). Papers in these two journals are always field Astrobiology."], ["Sheets", "1 Astrobio papers (+1b Citations, one row per reference) · 2 Astrobio authors (+2b Author publications) · 3 Cited papers · 4 Cited authors · 5 Representation · Journals (how each journal's field was assigned)."], ["Paper field", "A paper's field is its journal's field, except in multidisciplinary journals (SCImago category 'Multidisciplinary': Nature, Science, PNAS, Scientific Reports, PLoS ONE, Science Advances, Nature Communications...), where it is the field of the paper's own OpenAlex primary topic, mapped like the journal categories except that the topics 'Origins and Evolution of Life' and 'Space Science and Extraterrestrial Life' (filed by OpenAlex under Astronomy and Astrophysics) count as Astrobiology; the 'Field basis' column says which. So an author's Astrobiology share covers papers in the two astrobiology journals plus astrobiology-topic papers in multidisciplinary journals, while 'Times authored on astrobiology journals' counts only the former. Sheet 4 only has per-journal counts, so there a multidisciplinary journal counts as Others. Works not published in a journal (arXiv and other repositories, books without a journal, and meeting-abstract series such as AGU Fall Meeting, LPSC, GSA or DPS abstracts, i.e. sources outside SCImago with no ISSN or with abstract/meeting/conference in their name) are listed as '(not in a journal)' and left out of the percentages."], ["Journal field", "From the journal's SCImago (Scopus ASJC) subject categories (scimagojr 2025.csv): each category maps to one meta field (mapping below) and the journal takes the most frequent one; a tie is broken by the journal's OpenAlex topic shares. Journals SCImago doesn't list use their OpenAlex topic profile. Multidisciplinary journals have no field of their own (see 'Paper field'). See the Journals sheet."], ["References without a DOI", "Listed in 1b and sheet 3 with Crossref's citation text; their field is 'Unknown (no DOI)'. 1222 of the 9199 distinct cited works have no DOI."], ["Author identity", "OpenAlex author profiles, merged across every profile with the same ORCID. Authors of papers OpenAlex hasn't indexed yet are matched by ORCID, else by name search ('name search (check)'). For authors without an ORCID, 'Possible split profiles (check)' lists same-name OpenAlex profiles with more works: OpenAlex may have split the person, or it may be someone else."], ["Author main field", "The field with the biggest percentage of the author's journal publications; a tie shows both fields ('A / B'). Percentages count publications per field and sum to 100%."], ["5 Representation", "For each journal and for both together: 2.1 field mix of the distinct works it cites (a work cited several times counts once; works without a DOI, not in a journal or not found in OpenAlex are left out of the denominator); 2.2 field mix of its authors by main field (a tied main field counts 1/n to each field; only authors with at least 3 journal publications are counted, since a main field from one or two papers says little; an author in both journals counts once in 'Both journals'); 2.3 as 2.2 but each author weighted by their number of papers in that journal in the period. 3.1 compares 2.2 with 2.1 and 3.2 compares 2.3 with 2.1, as a ratio (1 = in proportion, below 1 = under-represented among authors) and as a difference in percentage points. The ratio is unstable for fields with a small cited share. Each scope's 'Total (denominator)' row gives the sample sizes and what was left out."], ["Excluded work types", "paratext, dataset, erratum, peer review, retraction."], ["Counts", "129 papers (International Journal of Astrobiology: 24, Astrobiology: 105) · 675 authors · 9199 distinct cited works · cited authors: 25708 of 25708 done."], ["Field mapping (category)", "Astronomy and Astrophysics → Astronomy/planetary science; Space and Planetary Science → Astronomy/planetary science; Biochemistry → Chemistry/Biochemistry; Environmental Chemistry → Chemistry/Biochemistry; Ecology → Biology; Ecological Modeling → Biology"], ["Field mapping (area)", "Agricultural and Biological Sciences → Biology; Biochemistry, Genetics and Molecular Biology → Biology; Immunology and Microbiology → Biology; Neuroscience → Biology; Earth and Planetary Sciences → Geoscience/planetary geo science; Chemistry → Chemistry/Biochemistry; Chemical Engineering → Chemistry/Biochemistry; Physics and Astronomy → Physics; Mathematics → Math and computer science; Computer Science → Math and computer science; Decision Sciences → Math and computer science; everything else, including Multidisciplinary → Others."], ["Sources", "Crossref (papers, reference lists), OpenAlex (authors, publication lists, cited works, journal topics), ORCID iDs as recorded in Crossref/OpenAlex, SCImago Journal Rank (journal subject categories)."]]}, {"name": "1 Astrobio papers", "note": "Not built yet: needs the cited-author run (see README).", "count": 129, "src": "data/sheet1.json"}, {"name": "1b Citations", "note": "Not built yet: needs the cited-author run (see README).", "count": 10892, "src": "data/sheet2.json"}, {"name": "2 Astrobio authors", "note": "Not built yet: needs the cited-author run (see README).", "count": 675, "src": "data/sheet3.json"}, {"name": "2b Author publications", "note": "Not built yet: needs the cited-author run (see README).", "count": 79217, "src": "data/sheet4.json"}, {"name": "3 Cited papers", "note": "Not built yet: needs the cited-author run (see README).", "count": 9199, "src": "data/sheet5.json"}, {"name": "4 Cited authors", "note": "Not built yet: needs the cited-author run (see README).", "count": 25708, "src": "data/sheet6.json"}, {"name": "5 Representation", "note": "Not built yet: needs the cited-author run (see README).", "count": 27, "src": "data/sheet7.json"}, {"name": "Journals", "note": "Not built yet: needs the cited-author run (see README).", "count": 43333, "src": "data/sheet8.json"}], "figure": {"src": "data/workflow.png", "alt": "Workflow: data sources, steps A–D and the tables each step produces", "caption": "Workflow: data sources (left), steps A–D, and the tables each step produces (right). Click to enlarge."}};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const PAGE = 300;
const state = DATA.sheets.map(() => ({q: '', sort: null, dir: 1, limit: PAGE, open: new Set()}));
let cur = 0;
try { const s = +localStorage.getItem('sheets:tab'); if (s >= 0 && s < DATA.sheets.length) cur = s; } catch {}

$('sub').textContent = DATA.subtitle;
const rowCount = s => s.rows ? s.rows.length : s.count;
$('tabs').innerHTML = DATA.sheets.map((s, i) =>
  `<button data-i="${i}">${esc(s.name)}${rowCount(s) != null ? `<span class="n">${rowCount(s).toLocaleString('en-US')}</span>` : ''}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
  cur = +b.dataset.i; try { localStorage.setItem('sheets:tab', cur); } catch {}
  $('q').value = state[cur].q; draw(); $('wrap').scrollTo(0, 0);
});

// share columns are named "... %", "% on ..." or "... topic share"; counts like "Publications in journals (used for %)" are not
const isPct = name => name.endsWith(' %') || name.startsWith('% ') || name.endsWith('topic share');
function cell(v, name) {
  if (v === null || v === undefined || v === '') return '<td></td>';
  if (typeof v === 'number') {
    if (isPct(name)) return `<td class="num">${(100 * v).toFixed(1)}%</td>`;
    if (/year/i.test(name)) return `<td class="num">${v}</td>`;
    return `<td class="num">${v.toLocaleString('en-US')}</td>`;
  }
  return `<td><div class="c">${esc(v)}</div></td>`;
}

function draw() {
  const sh = DATA.sheets[cur], st = state[cur];
  $('tabs').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === cur));
  if (sh.readme) {
    $('toolbar').style.display = 'none'; $('more').style.display = 'none';
    const fig = DATA.figure ? `<figure class="workflow"><a href="${esc(DATA.figure.src)}" target="_blank" rel="noopener"><img src="${esc(DATA.figure.src)}" alt="${esc(DATA.figure.alt)}"></a><figcaption>${esc(DATA.figure.caption)}</figcaption></figure>` : '';
    $('wrap').innerHTML = `<div style="padding:16px 18px">${fig}<div class="readme"><h2>${esc(sh.readme[0][0])}</h2><dl>` +
      sh.readme.slice(1).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl></div></div>';
    return;
  }
  $('toolbar').style.display = '';
  if (sh.src && !sh.rows) {
    $('count').textContent = ''; $('more').style.display = 'none';
    $('wrap').innerHTML = `<div class="empty">${sh.error ? esc(sh.error) : `Loading ${rowCount(sh).toLocaleString('en-US')} rows…`}</div>`;
    if (!sh.loading && !sh.error) {
      sh.loading = fetch(sh.src).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(j => { sh.cols = j.cols; sh.rows = j.rows; })
        .catch(e => { sh.error = `Could not load this sheet (${e.message}). Download the Excel file instead.`; sh.loading = null; })
        .then(() => { if (DATA.sheets[cur] === sh) draw(); });
    }
    return;
  }
  if (!sh.rows.length) {
    $('count').textContent = ''; $('more').style.display = 'none';
    $('wrap').innerHTML = `<div class="empty">${esc(sh.note || 'No rows.')}</div>`;
    return;
  }
  let rows = sh.rows.map((r, i) => [r, i]);
  if (st.q) {
    const q = st.q.toLowerCase();
    rows = rows.filter(([r]) => r.some(v => v != null && String(v).toLowerCase().includes(q)));
  }
  if (st.sort !== null) {
    const k = st.sort;
    rows.sort(([a], [b]) => {
      const x = a[k], y = b[k];
      if (x === y) return 0;
      if (x === null || x === '' || x === undefined) return 1;
      if (y === null || y === '' || y === undefined) return -1;
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * st.dir;
    });
  }
  $('count').textContent = `${rows.length.toLocaleString('en-US')} of ${sh.rows.length.toLocaleString('en-US')} rows`;
  let h = '<table><thead><tr><th style="cursor:default">#</th>' + sh.cols.map((c, k) =>
    `<th data-k="${k}">${esc(c)}${st.sort === k ? `<span class="arrow"> ${st.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`).join('') + '</tr></thead><tbody>';
  for (const [r, i] of rows.slice(0, st.limit)) {
    h += `<tr data-i="${i}" class="${st.open.has(i) ? 'open' : ''}"><th>${i + 1}</th>` + r.map((v, k) => cell(v, sh.cols[k])).join('') + '</tr>';
  }
  $('wrap').innerHTML = h + '</tbody></table>';
  $('more').style.display = rows.length > st.limit ? '' : 'none';
  $('wrap').querySelectorAll('thead th[data-k]').forEach(th => th.onclick = () => {
    const k = +th.dataset.k;
    if (st.sort === k) st.dir = -st.dir;
    else { st.sort = k; st.dir = typeof sh.rows[0][k] === 'number' ? -1 : 1; }
    draw();
  });
  $('wrap').querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => {
    const i = +tr.dataset.i; st.open.has(i) ? st.open.delete(i) : st.open.add(i); tr.classList.toggle('open');
  });
}

let t;
$('q').oninput = () => { clearTimeout(t); t = setTimeout(() => { state[cur].q = $('q').value; state[cur].limit = PAGE; draw(); }, 200); };
$('more').onclick = () => { state[cur].limit += PAGE * 3; draw(); };
$('q').value = state[cur].q;
draw();
</script>
</body>
</html>
